[project]
name = "blender-robin"
version = "0.1.0"
description = "Blender rendering scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "tomli-w>=1.0",
    "bce-python-sdk>=0.9",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "viztracer>=1.1.1",
]

[project.scripts]
robin = "blender_robin.cli:cli"

[tool.setuptools.packages.find]
include = ["blender_robin*"]

[tool.uv]
package = true
